<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f5f5f5;
padding-bottom:80px;
}

.topbar{
background:#1f9d55;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.card{
background:white;
margin:15px;
padding:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.metric{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
}

.circle{
width:60px;
height:60px;
border-radius:50%;
background:#e8f5e9;
border:5px solid #1f9d55;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:#1f9d55;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#1f9d55;
font-weight:bold;
font-size:13px;
}

</style>

</head>
